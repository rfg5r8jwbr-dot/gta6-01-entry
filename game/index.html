<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Heat — a top-down open-world crime game: steal cars, outrun the Solmar PD, run three story missions and taxi fares in a sun-soaked coastal city.">
<link rel="icon" href="data:,">
<title>Solmar Heat — an open-world crime story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #10141f;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    background: #1a2030;
    image-rendering: auto;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<p id="status" class="visually-hidden" aria-live="polite">Solmar Heat is loading.</p>

</body>
</html>
